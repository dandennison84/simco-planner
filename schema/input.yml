tables:

  company:
    version: 1
    intent: Defines scenario identity and global modifiers

    keys: [company_key]

    fields:
      company_key:
        type: int
        required: true
        unique: true
        constraints: { min: 1 }

      realm_key:
        type: int
        required: true
        constraints: { min: 1 }

      company_level:
        type: int
        required: true
        constraints: { min: 1 }

      production_speed_delta:
        type: float
        required: true
        constraints: { min: 0 }

      sales_speed_delta:
        type: float
        required: true
        constraints: { min: 0 }


  map_structure:
    version: 1
    intent: Defines map composition at slot level

    keys: [company_key, slot_key]

    fields:
      company_key:
        type: int
        required: true
        constraints: { min: 1 }

      slot_key:
        type: int
        required: true
        constraints: { min: 1, max: 18 }

      building_key:
        type: int
        required: true
        constraints: { min: 1 }

      building_level:
        type: int
        required: true
        constraints: { min: 1 }

      robots_installed:
        type: logical
        required: true


  production_plan:
    version: 1
    intent: Defines production allocation per slot

    keys: [company_key, slot_key, product_key, quality_level]

    fields:
      company_key:
        type: int
        required: true
        constraints: { min: 1 }

      slot_key:
        type: int
        required: true
        constraints: { min: 1, max: 18 }

      product_key:
        type: int
        required: true
        constraints: { min: 1 }

      quality_level:
        type: int
        required: true
        constraints: { min: 0 }

      production_split_fraction:
        type: float
        required: true
        constraints: { min: 0, max: 1 }


  override_exchange_prices:
    version: 1
    intent: Override exchange prices

    keys: [realm_key, product_key, quality_level]

    fields:
      realm_key:
        type: int
        required: true
        constraints: { min: 1 }

      product_key:
        type: int
        required: true
        constraints: { min: 1 }

      quality_level:
        type: int
        required: true
        constraints: { min: 0 }

      unit_price:
        type: float
        required: true
        constraints: { min: 0 }


  override_retail_prices:
    version: 1
    intent: Override retail prices

    keys: [realm_key, product_key, quality_level]

    fields:
      realm_key:
        type: int
        required: true
        constraints: { min: 1 }

      product_key:
        type: int
        required: true
        constraints: { min: 1 }

      quality_level:
        type: int
        required: true
        constraints: { min: 0 }

      unit_price:
        type: float
        required: true
        constraints: { min: 0 }

  clearing_plan:
      version: 1
      intent: Defines ordered channel allocation for surplus and shortage resolution

      keys: [company_key, product_key, quality_level, priority, channel_key]

      fields:

        company_key:
          type: int
          required: true
          constraints: { min: 1 }

        product_key:
          type: int
          required: true
          constraints: { min: 1 }

        quality_level:
          type: int
          required: true
          constraints: { min: 0 }

        priority:
          type: int
          required: true
          constraints: { min: 1 }

        channel_key:
          type: int
          required: true
          constraints: { min: 1 }

        allocation_units_per_hour:
          type: float
          constraints: { min: 0 }

        allocation_fraction:
          type: float                    
          constraints: { min: 0, max: 1 }