tables:

  company:
    version: 1
    intent: Defines scenario identity and global modifiers

    keys: [company_key]

    fields:
      company_key:
        type: int
        required: true
        unique: true
        constraints: { min: 1 }

      realm_key:
        type: int
        required: true
        constraints: { min: 1 }

      map_structure_key:
        type: int
        required: true
        constraints: { min: 1 }

      sales_plan_key:
        type: int
        required: true
        constraints: { min: 1 }

      company_level:
        type: int
        required: true
        constraints: { min: 1 }

      production_speed_delta:
        type: float
        required: true
        constraints: { min: 0 }

      sales_speed_delta:
        type: float
        required: true
        constraints: { min: 0 }


  map_structure:
    version: 1
    intent: Defines map composition at slot level

    keys: [map_structure_key, slot_key]

    fields:
      map_structure_key:
        type: int
        required: true
        constraints: { min: 1 }

      slot_key:
        type: int
        required: true
        constraints: { min: 1, max: 18 }

      building_key:
        type: int
        required: true
        constraints: { min: 1 }

      building_level:
        type: int
        required: true
        constraints: { min: 1 }

      robots_installed:
        type: logical
        required: true


  production_plan:
    version: 1
    intent: Defines production allocation per slot

    keys: [map_structure_key, slot_key, product_key, quality_level]

    fields:
      map_structure_key:
        type: int
        required: true
        constraints: { min: 1 }

      slot_key:
        type: int
        required: true
        constraints: { min: 1, max: 18 }

      product_key:
        type: int
        required: true
        constraints: { min: 1 }

      quality_level:
        type: int
        required: true
        constraints: { min: 0 }

      production_split_fraction:
        type: float
        required: true
        constraints: { min: 0, max: 1 }


  sales_plan:
    version: 1
    intent: Defines how products are sold across channels

    keys: [company_key, product_key, quality_level, sales_channel_key, priority]

    fields:
      company_key:
        type: int
        required: true
        constraints: { min: 1 }

      product_key:
        type: int
        required: true
        constraints: { min: 1 }

      quality_level:
        type: int
        required: true
        constraints: { min: 0 }

      sales_channel_key:
        type: int
        required: true
        constraints: { min: 1 }

      priority:
        type: int
        required: true
        constraints: { min: 1 }

      allocation_units_per_hour:
        type: float
        constraints: { min: 0 }

      allocation_frac:
        type: float
        constraints: { min: 0 }

      contract_discount_frac:
        type: float
        constraints: { min: 0 }


  override_exchange_prices:
    version: 1
    intent: Override exchange prices

    keys: [realm_key, product_key, quality_level]

    fields:
      realm_key:
        type: int
        required: true
        constraints: { min: 1 }

      product_key:
        type: int
        required: true
        constraints: { min: 1 }

      quality_level:
        type: int
        required: true
        constraints: { min: 0 }

      unit_price:
        type: float
        required: true
        constraints: { min: 0 }


  override_retail_prices:
    version: 1
    intent: Override retail prices

    keys: [realm_key, product_key, quality_level]

    fields:
      realm_key:
        type: int
        required: true
        constraints: { min: 1 }

      product_key:
        type: int
        required: true
        constraints: { min: 1 }

      quality_level:
        type: int
        required: true
        constraints: { min: 0 }

      unit_price:
        type: float
        required: true
        constraints: { min: 0 }

  