tables:

  building:
    version: 1
    intent: Building definitions

    keys: [building_key]

    fields:
      building_key:
        type: int
        required: true
        unique: true
        constraints: { min: 1 }

      building_name:
        type: string
        required: true

      building_category_key:
        type: int
        required: true
        constraints: { min: 1 }

      baseline_wage:
        type: float
        required: true
        constraints: { min: 0 }

      baseline_build_time_hours:
        type: float
        constraints: { min: 0 }

      baseline_robots:
        type: int
        constraints: { min: 0 }

      max_level:
        type: int
        constraints: { min: 1 }

      baseline_reference_value:
        type: float
        constraints: { min: 0 }


  building_category:
    version: 1
    intent: Building categories

    keys: [building_category_key]

    fields:
      building_category_key:
        type: int
        required: true
        constraints: { min: 1 }

      building_category_name:
        type: string
        required: true

      building_subcategory_name:
        type: string
        required: true

      counts_towards_ao:
        type: logical
        required: true

      economic_role_key:
        type: int
        required: true
        constraints: { min: 1 }


  building_bom:
    version: 1
    intent: Building BOM

    keys: [building_key, product_key]

    fields:
      building_key:
        type: int
        required: true
        constraints: { min: 1 }

      product_key:
        type: int
        required: true
        constraints: { min: 1 }

      baseline_quantity:
        type: float
        required: true
        constraints: { min: 0 }


  product:
    version: 1
    intent: Product definitions

    keys: [product_key]

    fields:
      product_key:
        type: int
        required: true
        constraints: { min: 1 }

      product_name:
        type: string
        required: true

      building_key:
        type: int
        required: true
        constraints: { min: 1 }

      baseline_output_per_hour:
        type: float
        required: true
        constraints: { min: 0 }

      transport_units_per_unit:
        type: float
        required: true
        constraints: { min: 0 }


  product_bom:
    version: 1
    intent: Product BOM

    keys: [product_key, input_product_key]

    fields:
      product_key:
        type: int
        required: true
        constraints: { min: 1 }

      input_product_key:
        type: int
        required: true
        constraints: { min: 1 }

      input_quantity:
        type: float
        required: true
        constraints: { min: 0 }


  exchange_prices:
    version: 1
    intent: Exchange prices

    keys: [realm_key, product_key, quality_level]

    fields:
      realm_key:
        type: int
        required: true
        constraints: { min: 1 }

      product_key:
        type: int
        required: true
        constraints: { min: 1 }

      quality_level:
        type: int
        required: true
        constraints: { min: 0 }

      unit_price:
        type: float
        required: true
        constraints: { min: 0 }


  retail_prices:
    version: 1
    intent: Retail prices

    keys: [realm_key, product_key, quality_level]

    fields:
      realm_key:
        type: int
        required: true
        constraints: { min: 1 }

      product_key:
        type: int
        required: true
        constraints: { min: 1 }

      quality_level:
        type: int
        required: true
        constraints: { min: 0 }

      unit_price:
        type: float
        required: true
        constraints: { min: 0 }

      baseline_retail_units:
        type: float
        constraints: { min: 0 }


  retail_product_building:
    version: 1
    intent: Retail building compatibility

    keys: [product_key, building_key]

    fields:
      product_key:
        type: int
        required: true
        constraints: { min: 1 }

      building_key:
        type: int
        required: true
        constraints: { min: 1 }


  channel:
    version: 1
    intent: Channel Domain

    keys: [channel_key]

    fields:
      channel_key:
        type: int
        required: true
        constraints: { min: 1 }

      channel_name:
        type: string
        required: true

      fee_fraction:
        type: float
        constraints: { min: 0 }

      transport_type:
        type: string
        required: true

      transport_multiplier:
        type: float
        constraints: { min: 0 }

      contract_discount_allowed:
        type: logical
        required: true

      uses_retail_capacity:
        type: logical
        required: true

      can_source:
        type: logical
        required: true

      can_sink:
        type: logical
        required: true


  realm:
    version: 1
    intent: Realms

    keys: [realm_key]

    fields:
      realm_key:
        type: int
        required: true
        constraints: { min: 1 }

      realm_name:
        type: string
        required: true


  economic_role:
    version: 1
    intent: Economic roles

    keys: [economic_role_key]

    fields:
      economic_role_key:
        type: int
        required: true
        constraints: { min: 1 }

      economic_role_name:
        type: string
        required: true


  economic_phase:
    version: 1
    intent: Economic phases

    keys: [economic_phase_key]

    fields:
      economic_phase_key:
        type: int
        required: true
        constraints: { min: 1 }

      economic_phase_name:
        type: string
        required: true


  seasons:
    version: 1
    intent: Seasons

    keys: [season_key]

    fields:
      season_key:
        type: int
        required: true
        constraints: { min: 1 }

      season_name:
        type: string
        required: true

  system_parameters:
    version: 1
    intent: Defines engine configuration and debug controls

    keys: [parameter_key]

    fields:
      parameter_key:
        type: string
        required: true

      parameter_value:
        type: string
        required: true
