tables:

  company_snapshot:
    version: 1
    intent: "Defines scenario identity, context, and global modifiers for the engine"

    fields:

      snapshot_key:
        type: int
        required: true
        unique: true
        constraints:
          min: 1

      realm_key:
        type: int
        required: true
        constraints:
          min: 1

      structure_map_key:
        type: int
        required: true
        constraints:
          min: 1

      company_level:
        type: int
        required: true
        constraints:
          min: 1

      production_speed_delta:
        type: float
        required: true

      sales_speed_delta:
        type: float
        required: true

company_observed:
    version: 1
    intent: "Observed/actual performance metrics for validation and analysis"

    fields:

      snapshot_key:
        type: int
        required: true
        constraints:
          min: 1

      sales_per_day:
        type: float
        required: false

      net_income_per_day:
        type: float
        required: false

      capital_buildings:
        type: float
        required: false

      capital_cip:
        type: float
        required: false       

structure_map:
    version: 1
    intent: "Defines the building composition of a map at slot-level granularity"

    fields:

      map_structure_key:
        type: int
        required: true
        constraints:
          min: 1

      slot_key:
        type: int
        required: true
        constraints:
          min: 1

      slot_state_key:
        type: int
        required: true
        constraints:
          min: 1

      building_key:
        type: int
        required: true
        constraints:
          min: 1

      building_level:
        type: int
        required: true
        constraints:
          min: 1

      robots_installed:
        type: string
        required: true

slot_product_assignment:
    version: 1
    intent: "Defines how each building slot's capacity is allocated across product and quality-level outputs over time"

    fields:

      map_structure_key:
        type: int
        required: true
        constraints:
          min: 1

      slot_key:
        type: int
        required: true
        constraints:
          min: 1

      product_key:
        type: int
        required: true
        constraints:
          min: 1

      quality_level:
        type: int
        required: true
        constraints:
          min: 0

      split_fraction:
        type: float
        required: true

sales_strategy:
    version: 1
    intent: "Defines how produced output is cleared across sales channels per snapshot, product, and quality level"

    fields:

      snapshot_key:
        type: int
        required: true
        constraints:
          min: 1

      product_key:
        type: int
        required: true
        constraints:
          min: 1

      quality_level:
        type: int
        required: true
        constraints:
          min: 0

      sales_channel_key:
        type: int
        required: true
        constraints:
          min: 1

      allocation_frac:
        type: float
        required: false
        constraints:
          min: 0
          max: 1

      allocation_units_per_hour:
        type: float
        required: false
        constraints:
          min: 0

      contract_discount_frac:
        type: float
        required: false
        constraints:
          min: 0

scenario_delta:
    version: 1
    intent: "Defines partial field-level modifications to a baseline snapshot to create a scenario-specific state"

    fields:

      scenario_key:
        type: int
        required: true
        constraints:
          min: 1

      target_table:
        type: string
        required: true

      target_key:
        type: string
        required: true
        notes: "Serialized key identifying the row at the table grain (e.g., slot_key=3)"

      field_name:
        type: string
        required: true

      value:
        type: string
        required: true
        notes: "Serialized value representing the updated field value"          