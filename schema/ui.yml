tables:

  tblCompany:
    validations:
      - column: "Realm Name"
        lookup: "realm"

  tblMapStructure:
    validations:
      - column: "Building Name"
        lookup: "building"

  tblProductionPlan:
    validations:
      - column: "Product Name"
        lookup: "product"

  tblClearingPlan:
    validations:
      - column: "Product Name"
        lookup: "product"
      - column: "Channel Name"
        lookup: "channel"

  tblOverrideExchangePrices:
    validations:
      - column: "Realm Name"
        lookup: "realm"
      - column: "Product Name"
        lookup: "product"

  tblOverrideRetailPrices:
    validations:
      - column: "Realm Name"
        lookup: "realm"
      - column: "Product Name"
        lookup: "product"