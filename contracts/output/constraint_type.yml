kind: table
version: 1
table: constraint_type
surface: output

intent: >
  Classifies the primary constraint driver for each product:
  retail_constrained, supply_constrained, or not_constrained.

presence:
  required: true
  non_empty: false

keys:
  - company_key
  - product_key
  - quality_level

fields:
  company_key:
    type: int
    required: true

  product_key:
    type: int
    required: true

  quality_level:
    type: int
    required: true

  building_key:
    type: int
    required: true
    
  constraint_type:
    type: string
    required: true