kind: table
version: 1
table: product_role_classification
surface: output

intent: >
  Classifies each product by business role within the company:
  retail_output, pure_non_retail_output, or vi_input.

presence:
  required: true
  non_empty: false

keys:
  - company_key
  - product_key
  - quality_level

fields:
  company_key:
    type: int
    required: true

  product_key:
    type: int
    required: true

  quality_level:
    type: int
    required: true

  building_key:
    type: int
    required: true
    
  product_role:
    type: string
    required: true
