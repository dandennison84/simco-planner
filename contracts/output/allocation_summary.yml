kind: table
version: 1
table: allocation_summary
surface: output

intent: >
  Product-level allocation summary showing total flow,
  retail utilization, and retail capacity constraints.

presence:
  required: true
  non_empty: false

keys:
  - company_key
  - product_key
  - quality_level

fields:
  company_key:
    type: int
    required: true

  product_key:
    type: int
    required: true

  quality_level:
    type: int
    required: true

  total_units_per_hour:
    type: float
    required: true
    constraints:
      min: 0

  retail_units_per_hour:
    type: float
    required: true
    constraints:
      min: 0

  non_retail_units_per_hour:
    type: float
    required: true
    constraints:
      min: 0

  retail_shortfall_units_per_hour:
    type: float
    required: true
    constraints:
      min: 0

  retail_capture_pct:
    type: float
    required: true
    constraints:
      min: 0
      max: 1

  is_retail_capped:
    type: boolean
    required: true