kind: table
version: 1
table: clearing_plan
surface: input
intent: Defines ordered channel allocation for surplus and shortage resolution

presence:
  required: true
  non_empty: false

keys:
  - company_key
  - product_key
  - quality_level
  - priority
  - channel_key

fields:
  company_key:
    type: int
    required: true
    constraints: { min: 1 }

  product_key:
    type: int
    required: true
    constraints: { min: 1 }

  quality_level:
    type: int
    required: true
    constraints: { min: 0 }

  priority:
    type: int
    required: true
    constraints: { min: 1 }

  channel_key:
    type: int
    required: true
    constraints: { min: 1 }

  allocation_units_per_hour:
    type: float
    required: false
    constraints: { min: 0 }

  allocation_frac:
    type: float
    required: false
    constraints: { min: 0, max: 1 }