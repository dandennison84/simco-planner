kind: table
version: 1
table: override_exchange_prices
surface: input
intent: Override exchange prices

presence:
  required: false
  non_empty: false

keys:
  - realm_key
  - product_key
  - quality_level

fields:
  realm_key:
    type: int
    required: true
    constraints: { min: 1 }

  product_key:
    type: int
    required: true
    constraints: { min: 1 }

  quality_level:
    type: int
    required: true
    constraints: { min: 0 }

  unit_price:
    type: float
    required: true
    constraints: { min: 0 }