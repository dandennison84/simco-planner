kind: table
version: 1
table: product
surface: reference
intent: Product definitions

presence:
  required: true
  non_empty: true

keys:
  - product_key

fields:
  product_key:
    type: int
    required: true
    constraints: { min: 1 }

  product_name:
    type: string
    required: true

  building_key:
    type: int
    required: true
    constraints: { min: 1 }

  baseline_output_per_hour:
    type: float
    required: true
    constraints: { min: 0 }

  transport_units_per_unit:
    type: float
    required: true
    constraints: { min: 0 }